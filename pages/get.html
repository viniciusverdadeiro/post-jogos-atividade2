<!DOCTYPE html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de jogos</title>
    <link rel="stylesheet" href="../css/get.css" />
    <script src="../js/get.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Lista dos jogos</h1>
      <p>Prática do método GET: buscar e exibir dados da API.</p>
    </header>

    <main>
      <a href="../index.html">Voltar ao cadastro (POST)</a>
      <section aria-labelledby="titulo-lista">
        <h2 id="titulo-lista">Heróis cadastrados</h2>
        <p>Os heróis são carregados automaticamente ao abrir a página.</p>
        <p id="resposta" role="status" aria-live="polite"></p>
        <ul id="lista-jogos"></ul>
      </section>
    </main>

    <footer>
      <p>Prática de consulta com API.</p>
    </footer>

    <template id="modelo-jogo">
      <li>
        <div class="card-capa">
          <span class="sem-imagem">Imagem indisponível</span>
          <img alt="" loading="lazy" />
        </div>
        <div class="card-conteudo">
          <h3 class="nome"></h3>
          <p><strong>Genero:</strong> <span class="genero"></span></p>
          <p><strong>Plataforma:</strong> <span class="plataforma"></span></p>
          <p><strong>Ano de lançamento:</strong> <span class="ano_lancamento"></span></p>
          <p><strong>Desenvolvedora:</strong> <span class="desenvolvedora"></span></p>
        </div>
      </li>
    </template>
  </body>
</html>
